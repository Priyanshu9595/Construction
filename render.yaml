services:
  # Backend Web Service
  - type: web
    name: buildflow-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: buildflow-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: buildflow-backend
          envVarKey: RENDER_EXTERNAL_URL
